<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Ticket</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ticket-card">
    <h2>Create New Ticket</h2>
    <p class="subtitle">Describe your issue and we'll help you as soon as possible.</p>

    <form>
        <div class="field">
            <label>Title</label>
            <input type="text" placeholder="Enter ticket title" required>
        </div>

        <div class="row">
            <div class="field">
                <label>Category</label>
                <select required>
                    <option value="" disabled selected>Select category</option>
                    <option value="hardware">Hardware</option>
                    <option value="software">Software</option>
                    <option value="network">Network</option>
                </select>
            </div>
            <div class="field">
                <label>Priority</label>
                <select required>
                    <option value="" disabled selected>Select priority</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label>Description</label>
            <textarea placeholder="Describe your issue in detail..." required></textarea>
        </div>

        <button type="submit" class="btn">Submit Ticket</button>
    </form>
</div>
</body>
</html>
